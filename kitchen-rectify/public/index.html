<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食堂后厨整改台</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="portal-hero">
  <div class="logo">🍳</div>
  <h1>食堂后厨整改台</h1>
  <p>发现问题 · 扫码整改 · 验收闭环</p>
</div>
<div class="wrap">
  <div class="portal-card" onclick="location.href='/admin.html'">
    <div class="ic" style="background:#fff1e8">📋</div>
    <div>
      <div class="t">管理员检查台</div>
      <div class="d">上传灶台 / 冰箱 / 地面问题照片，生成编号与整改码</div>
    </div>
    <div class="arrow">›</div>
  </div>
  <div class="portal-card" onclick="location.href='/fix.html'">
    <div class="ic" style="background:#e4f0fd">📷</div>
    <div>
      <div class="t">后厨员工整改</div>
      <div class="d">扫描整改码，补充整改完成照片并提交验收</div>
    </div>
    <div class="arrow">›</div>
  </div>
  <div class="portal-card" onclick="location.href='/dashboard.html'">
    <div class="ic" style="background:#e2f6ec">📊</div>
    <div>
      <div class="t">负责人汇总页</div>
      <div class="d">扣分明细、整改状态与完成率一览</div>
    </div>
    <div class="arrow">›</div>
  </div>
  <p class="muted" style="text-align:center;margin-top:18px">图片仅限 JPG/PNG，单张不超过 10MB</p>
</div>
<script src="/js/common.js"></script>
</body>
</html>
